[project]
name = "production-ai-platform"
version = "0.2.0"
description = "Multi-agent RAG platform with FastAPI, LangGraph, ChromaDB, and Prometheus metrics."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.138.0",
    "uvicorn>=0.49.0",
    "langgraph>=1.2.6",
    "chromadb>=1.5.9",
    "sentence-transformers>=5.6.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "prometheus-client>=0.25.0",
    "prometheus-fastapi-instrumentator>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "httpx>=0.28.1",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Integration tests load the real embedding model and are opt-in: pytest -m integration
addopts = "-m 'not integration'"
markers = [
    "integration: loads the real embedding model and a temporary ChromaDB index",
]
