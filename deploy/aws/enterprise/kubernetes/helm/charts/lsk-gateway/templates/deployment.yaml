{{- if not .Values.image.repository -}}
{{- fail "image.repository must be set to an approved private ECR repository" -}}
{{- end -}}
{{- if not regexMatch "^sha256:[0-9a-f]{64}$" .Values.image.digest -}}
{{- fail "image.digest must be an immutable sha256 digest" -}}
{{- end -}}
{{- if ne .Values.env.stage "poc" -}}
{{- fail "pilot/production deployment blocked: gateway lacks enterprise OIDC" -}}
{{- end -}}
{{- if not .Values.existingSecretName -}}
{{- fail "existingSecretName required; never pass shared keys in Helm values" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    app.kubernetes.io/name: lsk-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: lsk-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lsk-gateway
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | quote }}
      automountServiceAccountToken: false
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8090
              name: http
          env:
            - name: LSK_STAGE
              value: "poc"
            - name: LSK_TENANT_ID
              value: {{ .Values.env.tenantId | quote }}
            - name: LSK_ENABLE_DEMO_WRITES
              value: "false"
            - name: AWS_REGION
              value: {{ .Values.env.awsRegion | quote }}
            - name: BEDROCK_MODEL_ID
              value: {{ .Values.env.bedrockModelId | quote }}
            - name: SALES_SERVICE_URL
              value: {{ .Values.env.salesUrl | quote }}
            - name: MARKETING_SERVICE_URL
              value: {{ .Values.env.marketingUrl | quote }}
            - name: FINANCE_SERVICE_URL
              value: {{ .Values.env.financeUrl | quote }}
            - name: GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecretName | quote }}
                  key: GATEWAY_API_KEY
            - name: DEMO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecretName | quote }}
                  key: DEMO_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
