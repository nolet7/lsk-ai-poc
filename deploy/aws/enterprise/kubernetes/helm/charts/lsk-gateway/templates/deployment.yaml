{{- include "lsk-gateway.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    app.kubernetes.io/name: lsk-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: lsk-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lsk-gateway
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: {{ .Values.serviceAccount.name | quote }}
      automountServiceAccountToken: false
      containers:
        - name: gateway
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8090
              name: http
          env:
            - name: LSK_STAGE
              value: "poc"
            - name: LSK_TENANT_ID
              value: {{ .Values.env.tenantId | quote }}
            - name: LSK_ENABLE_DEMO_WRITES
              value: "false"
            - name: AWS_REGION
              value: {{ .Values.env.awsRegion | quote }}
            - name: BEDROCK_MODEL_ID
              value: {{ .Values.env.bedrockModelId | quote }}
            - name: SALES_SERVICE_URL
              value: {{ .Values.env.salesUrl | quote }}
            - name: MARKETING_SERVICE_URL
              value: {{ .Values.env.marketingUrl | quote }}
            - name: FINANCE_SERVICE_URL
              value: {{ .Values.env.financeUrl | quote }}
            - name: GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecretName | quote }}
                  key: GATEWAY_API_KEY
            - name: DEMO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecretName | quote }}
                  key: DEMO_API_KEY
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 18
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
