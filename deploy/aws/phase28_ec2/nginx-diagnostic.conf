# Diagnostic-only: loopback HTTP, not reachable from external hosts.
# Production TLS ingress is a separate, gated phase.
server {
    listen 127.0.0.1:18080;
    server_name localhost;
    access_log off;
    server_tokens off;
    client_max_body_size 16k;
    location = /health/live {
        proxy_pass http://127.0.0.1:8080/health/live;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }
    location = /health/ready {
        proxy_pass http://127.0.0.1:8080/health/ready;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }
    location / { return 503; }
}
