name: fde-commercial-agent-security
on:
  workflow_dispatch:
  push:
    branches: ['feature/phase28-ai-deploy']
    paths:
      - 'phase28/fde_commercial/**'
      - 'phase28/tests/test_fde_commercial.py'
      - 'phase28/tests/test_fde_postgres.py'
      - 'phase28/tests/test_fde_mcp.py'
      - 'phase28/production_app.py'
      - 'phase28/sql/002_procurement.sql'
      - '.github/workflows/fde-commercial-ci.yml'
  pull_request:
    paths:
      - 'phase28/fde_commercial/**'
      - 'phase28/tests/test_fde_commercial.py'
      - 'phase28/tests/test_fde_postgres.py'
      - 'phase28/production_app.py'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install production integration dependencies
        run: python -m pip install -r requirements-p28-13.txt -r deploy/environments/production/requirements.txt
      - name: Run bounded agent and tenant boundary tests
        run: python -m unittest phase28.tests.test_fde_commercial phase28.tests.test_fde_mcp -v
      - name: Syntax checks
        run: python -m compileall -q phase28/fde_commercial phase28/production_app.py

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: demo_only
          POSTGRES_DB: lsk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U demo -d lsk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LSK_TEST_PG_DSN: postgresql://demo:demo_only@localhost:5432/lsk_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install psycopg and SDK dependencies
        run: python -m pip install -r requirements-p28-13.txt -r deploy/environments/production/requirements.txt
      - name: PostgreSQL-backed tenant and approval integrity tests
        run: python -m unittest phase28.tests.test_fde_postgres -v
