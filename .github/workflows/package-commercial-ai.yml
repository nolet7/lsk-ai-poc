name: Package commercial AI POC for AWS (manual)

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Release label (for example, dev-poc-01)"
        required: true
        type: string
        default: "dev-poc-01"

permissions:
  contents: read

jobs:
  package:
    name: Test and package four-service application
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout gateway source
        uses: actions/checkout@v4
      - name: Checkout private Sales at pinned revision
        uses: actions/checkout@v4
        with:
          repository: nolet7/lsk-sales-account
          ref: c7cfd3bd9c43b3651cd58396a40522fd0e9eeb81
          token: ${{ secrets.LSK_BUSINESS_REPOS_TOKEN }}
          path: external/lsk-sales-account
          persist-credentials: false
      - name: Checkout private Marketing at pinned revision
        uses: actions/checkout@v4
        with:
          repository: nolet7/lsk-marketing
          ref: 161882119381132b33ac71cc6e73ab3004223ee2
          token: ${{ secrets.LSK_BUSINESS_REPOS_TOKEN }}
          path: external/lsk-marketing
          persist-credentials: false
      - name: Checkout private Finance at pinned revision
        uses: actions/checkout@v4
        with:
          repository: nolet7/lsk-finance
          ref: 52def231ef2f0bbc107bb3813bca6ceac186ddcb
          token: ${{ secrets.LSK_BUSINESS_REPOS_TOKEN }}
          path: external/lsk-finance
          persist-credentials: false
      - name: Verify private app versions
        run: bash scripts/verify_business_versions.sh
      - name: Run contract and safety tests
        run: |
          python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'boto3>=1.35,<2'
          python -m unittest discover -s tests -p 'test_gateway_contract.py' -v
          python -m unittest discover -s tests -p 'test_enterprise_architecture.py' -v
      - name: Package without credentials, git metadata or local state
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_NAME" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{1,49}$ ]] || { echo "::error::Invalid release name"; exit 1; }
          mkdir -p dist
          tar -czf "dist/lsk-commercial-ai-${RELEASE_NAME}.tar.gz" \
            --exclude='.git' --exclude='.env' --exclude='.env.*' \
            --exclude='*.pem' --exclude='*.key' --exclude='*.p12' \
            --exclude='*.sqlite3' --exclude='__pycache__' \
            --exclude='.terraform' --exclude='*.tfstate*' \
            integrations external scripts compose.business.yml deploy/aws/ec2
          tar -tzf "dist/lsk-commercial-ai-${RELEASE_NAME}.tar.gz" | grep -E '(^integrations/gateway.py$|^compose.business.yml$|^external/lsk-finance/)' >/dev/null
          sha256sum dist/*.tar.gz | tee dist/SHA256SUMS
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: lsk-commercial-ai-${{ inputs.release_name }}
          path: dist/
          retention-days: 3
          if-no-files-found: error
