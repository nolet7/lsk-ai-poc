name: phase28-p14-offline-ci
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'phase28/**'
      - 'deploy/aws/phase28_gateway/**'
      - 'requirements-p28-13.txt'
      - '.github/workflows/phase28-p14-ci.yml'
  push:
    branches:
      - 'feature/phase28-bedrock-ai-lab'
    paths:
      - 'phase28/**'
      - 'deploy/aws/phase28_gateway/**'
      - 'requirements-p28-13.txt'
      - '.github/workflows/phase28-p14-ci.yml'
permissions:
  contents: read
jobs:
  offline-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test and security tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-p28-13.txt
          python -m pip install pip-audit
      - name: Run Phase 28 regression suite
        run: python -m unittest discover -s phase28/tests -v
      - name: Dependency vulnerability audit
        run: python -m pip_audit -r requirements-p28-13.txt
      - name: Build local diagnostic container
        run: docker build -f deploy/aws/phase28_gateway/Dockerfile -t phase28-gateway:ci .
      - name: Smoke-test diagnostic container
        run: |
          docker run -d --name p28-gateway -p 127.0.0.1:18080:8080 phase28-gateway:ci
          trap 'docker rm -f p28-gateway >/dev/null 2>&1 || true' EXIT
          python - <<'PY'
          import time, urllib.request, urllib.error
          for _ in range(25):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:18080/health/live', timeout=1) as r:
                      assert r.status == 200
                  break
              except (urllib.error.URLError, TimeoutError):
                  time.sleep(0.2)
          else:
              raise RuntimeError('Container liveness failed')
          try:
              urllib.request.urlopen('http://127.0.0.1:18080/health/ready', timeout=2)
              raise AssertionError('Readiness unexpectedly passed')
          except urllib.error.HTTPError as exc:
              assert exc.code == 503
          PY
