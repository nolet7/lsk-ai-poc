name: phase28-dockerless-offline-ci
on:
  workflow_dispatch:
  pull_request:
    paths: ['phase28/**', 'deploy/aws/phase28_ec2/**', 'requirements-p28-13.txt', '.github/workflows/phase28-p14-ci.yml']
  push:
    branches: ['feature/phase28-bedrock-ai-lab']
    paths: ['phase28/**', 'deploy/aws/phase28_ec2/**', 'requirements-p28-13.txt', '.github/workflows/phase28-p14-ci.yml']
permissions:
  contents: read
jobs:
  python-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Dependencies
        run: |
          python -m pip install -r requirements-p28-13.txt
          python -m pip install pip-audit
      - name: Regression
        run: python -m unittest discover -s phase28/tests -v
      - name: Vulnerability audit
        run: python -m pip_audit -r requirements-p28-13.txt
      - name: Shell syntax
        run: bash -n deploy/aws/phase28_ec2/install-from-checkout.sh deploy/aws/phase28_ec2/smoke.sh
      - name: Offline deployment checks
        run: python -m unittest discover -s phase28/tests -p 'test_ec2_deployment.py' -v
