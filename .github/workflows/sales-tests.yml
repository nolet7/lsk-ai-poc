name: Sales pilot tests
on:
  push:
    paths:
      - 'sales_enablement/**'
      - 'tests/test_sales.py'
      - '.github/workflows/sales-tests.yml'
  pull_request:
    paths:
      - 'sales_enablement/**'
      - 'tests/test_sales.py'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
