name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and unit/API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install locked dependencies (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Lint
        run: ruff check .

      - name: Unit and API tests (fake embedder, no model download)
        run: pytest -q

  retrieval-gate:
    name: Real-model retrieval gate
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Install locked dependencies (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Integration tests with the real model
        run: pytest -m integration -q

      - name: Build index and enforce the golden-set threshold
        run: |
          python -m rag.ingest
          python -m evaluation.run_eval --min-hit-rate 0.75

  docker:
    name: Container build and smoke test
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t production-ai-platform:ci .

      - name: Smoke test liveness
        run: |
          docker run -d --name platform -p 8000:8000 production-ai-platform:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo
              exit 0
            fi
            sleep 4
          done
          docker logs platform
          exit 1
