name: Business integration gateway tests
on:
  push:
    paths:
      - 'integrations/**'
      - 'tests/test_gateway_contract.py'
      - 'tests/test_bedrock_ai.py'
      - 'tests/test_asr_agent.py'
      - 'tests/test_gateway_agent.py'
      - '.github/workflows/business-integration.yml'
  pull_request:
    paths:
      - 'integrations/**'
      - 'tests/test_gateway_contract.py'
jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "fastapi>=0.115,<1" "httpx>=0.27,<1" "boto3>=1.35,<2" "langgraph>=1,<2"
      - run: python -m unittest discover -s tests -p 'test_*ai.py' -v
      - run: python -m unittest discover -s tests -p 'test_asr_agent.py' -v
      - run: python -m unittest discover -s tests -p 'test_gateway_agent.py' -v
      - run: python -m unittest discover -s tests -p test_gateway_contract.py -v
      - run: python -m compileall -q integrations
