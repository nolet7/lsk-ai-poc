name: Business AI gateway safety and contract tests
on:
  push:
    branches: [poc, pilot, production]
    paths:
      - 'integrations/**'
      - 'tests/test_gateway_contract.py'
      - 'tests/test_gateway_ai.py'
      - 'tests/test_gateway_agent.py'
      - 'tests/test_bedrock_ai.py'
      - 'tests/test_asr_agent.py'
      - 'tests/test_release_guard.py'
      - 'compose.business.yml'
      - '.github/workflows/business-integration.yml'
  pull_request:
    paths:
      - 'integrations/**'
      - 'tests/**'
      - 'compose.business.yml'
jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "fastapi>=0.115,<1" "httpx>=0.27,<1" "boto3>=1.35,<2" "langgraph>=1,<2" "prometheus-client>=0.20,<1"
      - name: Safety and contract tests (no AWS credentials)
        run: |
          python -m unittest discover -s tests -p test_gateway_contract.py -v
          python -m unittest discover -s tests -p test_gateway_ai.py -v
          python -m unittest discover -s tests -p test_gateway_agent.py -v
          python -m unittest discover -s tests -p test_bedrock_ai.py -v
          python -m unittest discover -s tests -p test_asr_agent.py -v
          python -m unittest discover -s tests -p test_release_guard.py -v
      - run: python -m compileall -q integrations
