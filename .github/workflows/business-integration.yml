name: Business AI gateway safety and contract tests
on:
  push:
    branches: [poc, pilot, production]
    paths:
      - 'integrations/**'
      - 'tests/test_gateway_contract.py'
      - 'tests/test_gateway_ai.py'
      - 'tests/test_gateway_agent.py'
      - 'tests/test_bedrock_ai.py'
      - 'tests/test_lsk_agent.py'
      - 'tests/test_release_guard.py'
      - 'tests/test_operational_contract.py'
      - 'tests/test_oidc_stage.py'
      - 'tests/test_oidc_crypto.py'
      - 'tests/test_branch_stage.py'
      - 'tests/test_lsk_branding.py'
      - 'tests/test_lsk_evaluation.py'
      - 'scripts/smoke_integration.py'
      - 'evaluation/fixtures/lsk_golden.json'
      - 'compose.business.yml'
      - 'scripts/**'
      - 'integrations/app-versions.env'
      - '.github/workflows/business-integration.yml'
  pull_request:
    paths:
      - 'integrations/**'
      - 'tests/**'
      - 'compose.business.yml'
jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "fastapi>=0.115,<1" "httpx>=0.27,<1" "boto3>=1.35,<2" "langgraph>=1,<2" "prometheus-client>=0.20,<1" "PyJWT[crypto]>=2.9,<3"
      - name: Safety and contract tests (no AWS credentials)
        run: |
          python -m unittest discover -s tests -p test_gateway_contract.py -v
          python -m unittest discover -s tests -p test_gateway_ai.py -v
          python -m unittest discover -s tests -p test_gateway_agent.py -v
          python -m unittest discover -s tests -p test_bedrock_ai.py -v
          python -m unittest discover -s tests -p test_lsk_agent.py -v
          python -m unittest discover -s tests -p test_release_guard.py -v
          python -m unittest discover -s tests -p test_operational_contract.py -v
          python -m unittest discover -s tests -p test_oidc_stage.py -v
          python -m unittest discover -s tests -p test_oidc_crypto.py -v
          python -m unittest discover -s tests -p test_branch_stage.py -v
          python -m unittest discover -s tests -p test_lsk_branding.py -v
          python -m unittest discover -s tests -p test_lsk_evaluation.py -v
      - name: Shell script syntax
        run: |
          for script in scripts/*.sh infrastructure/*.sh; do bash -n "$script"; done
      - name: Docker Compose schema (build not required)
        env:
          GATEWAY_API_KEY: ci-dummy-gateway-key
          DEMO_API_KEY: ci-dummy-demo-key
        run: docker compose -f compose.business.yml config --quiet
      - run: python -m compileall -q integrations

  integration-smoke:
    needs: gateway
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install service and gateway dependencies
        run: python -m pip install "fastapi>=0.115,<1" "uvicorn>=0.30,<1" "httpx>=0.27,<1" "langgraph>=1,<2" "boto3>=1.35,<2" "prometheus-client>=0.20,<1" "PyJWT[crypto]>=2.9,<3"
      - name: Clone pinned standalone synthetic services
        run: bash scripts/clone_business_apps.sh
      - name: Check pinned clean revisions
        run: bash scripts/verify_business_versions.sh
      - name: Exercise four real HTTP servers without credentials or model charges
        run: python scripts/smoke_integration.py
