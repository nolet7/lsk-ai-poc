name: LSK governed commercial AI API tests
on:
  push:
    branches: [main]
    paths:
      - 'integrations/**'
      - 'tests/**'
      - 'compose.business.yml'
      - '.github/workflows/business-integration.yml'
  pull_request:
    paths:
      - 'integrations/**'
      - 'tests/**'
      - 'compose.business.yml'
      - '.github/workflows/business-integration.yml'
permissions:
  contents: read
jobs:
  contract-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gateway dependencies
        run: python -m pip install "fastapi>=0.115,<1" "uvicorn>=0.30,<1" "httpx>=0.27,<1" "boto3>=1.35,<2"
      - name: Existing gateway contract tests
        run: python -m unittest discover -s tests -p test_gateway_contract.py -v
      - name: Enterprise boundary and model tests (no network model calls)
        run: python -m unittest discover -s tests -p test_enterprise_architecture.py -v
      - name: Python compile
        run: python -m compileall -q integrations
      - name: Compose schema validation
        env:
          GATEWAY_API_KEY: ci-local-gateway-key
          DEMO_API_KEY: ci-local-service-key
        run: docker compose -f compose.business.yml config --quiet
