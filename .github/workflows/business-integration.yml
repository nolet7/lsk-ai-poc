name: LSK governed commercial AI API tests
on:
  push:
    branches: [main]
    paths:
      - 'integrations/**'
      - 'tests/**'
      - 'compose.business.yml'
      - '.github/workflows/business-integration.yml'
  pull_request:
    paths:
      - 'integrations/**'
      - 'tests/**'
      - 'compose.business.yml'
      - '.github/workflows/business-integration.yml'
permissions:
  contents: read
jobs:
  contract-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gateway dependencies
        run: python -m pip install "fastapi>=0.115,<1" "uvicorn>=0.30,<1" "httpx>=0.27,<1" "boto3>=1.35,<2"
      - name: Existing gateway contract tests
        run: python -m unittest discover -s tests -p test_gateway_contract.py -v
      - name: Enterprise boundary and model tests (no network model calls)
        run: python -m unittest discover -s tests -p test_enterprise_architecture.py -v
      - name: Python compile
        run: python -m compileall -q integrations
      - name: Compose schema validation
        env:
          GATEWAY_API_KEY: ci-local-gateway-key
          DEMO_API_KEY: ci-local-service-key
        run: docker compose -f compose.business.yml config --quiet

  four-service-smoke:
    # These business repositories may be private. Never assume that the
    # central repo's GITHUB_TOKEN can read other repositories.
    # Set repository variable LSK_INTEGRATION_ENABLED=true only after setting
    # the LSK_INTEGRATION_APP_ID and LSK_INTEGRATION_APP_PRIVATE_KEY secrets.
    if: ${{ vars.LSK_INTEGRATION_ENABLED == 'true' }}
    needs: contract-and-security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate short-lived cross-repository read token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.LSK_INTEGRATION_APP_ID }}
          private-key: ${{ secrets.LSK_INTEGRATION_APP_PRIVATE_KEY }}
          owner: nolet7
          repositories: |
            lsk-sales-account
            lsk-marketing
            lsk-finance
          permission-contents: read
      - name: Read reviewed application versions
        id: versions
        shell: bash
        run: |
          source integrations/app-versions.env
          echo "sales=$SALES_COMMIT" >> "$GITHUB_OUTPUT"
          echo "marketing=$MARKETING_COMMIT" >> "$GITHUB_OUTPUT"
          echo "finance=$FINANCE_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned Sales application
        uses: actions/checkout@v4
        with:
          repository: nolet7/lsk-sales-account
          ref: ${{ steps.versions.outputs.sales }}
          path: external/lsk-sales-account
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - name: Checkout pinned Marketing application
        uses: actions/checkout@v4
        with:
          repository: nolet7/lsk-marketing
          ref: ${{ steps.versions.outputs.marketing }}
          path: external/lsk-marketing
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - name: Checkout pinned Finance application
        uses: actions/checkout@v4
        with:
          repository: nolet7/lsk-finance
          ref: ${{ steps.versions.outputs.finance }}
          path: external/lsk-finance
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - name: Verify pinned application revisions
        run: bash scripts/verify_business_versions.sh
      - name: Install synthetic business and gateway dependencies
        run: python -m pip install "fastapi>=0.115,<1" "uvicorn>=0.30,<1" "httpx>=0.27,<1" "boto3>=1.35,<2" "PyJWT[crypto]>=2.9,<3"
      - name: Four-process HTTP integration without Bedrock charges
        run: python scripts/smoke_business.py
