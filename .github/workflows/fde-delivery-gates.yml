name: fde-environment-gates
on:
  workflow_dispatch:
  push:
    paths:
      - 'deploy/environments/**'
      - 'docs/fde/**'
      - 'scripts/check_fde_environments.py'
      - '.github/workflows/fde-delivery-gates.yml'
  pull_request:
    paths:
      - 'deploy/environments/**'
      - 'docs/fde/**'
      - 'scripts/check_fde_environments.py'
      - '.github/workflows/fde-delivery-gates.yml'
permissions:
  contents: read
jobs:
  guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Environment contracts and fail-closed defaults
        run: python scripts/check_fde_environments.py
